[package]
name = "draw-boxes"
version = "0.2.0"
edition = "2021"

[lib]
name = "draw_boxes"
crate-type = ["cdylib"]

[features]
# The GPU build: the outlines drawn on the device over a picture held on the
# GPU, importing ffrwd:gpu and wasi:webgpu. The `draw-boxes-gpu` crate
# builds this source with it on, as draw_boxes_gpu.wasm.
gpu = ["dep:rfdetr-gpu"]

[dependencies]
ffrwd-node = { git = "https://github.com/imbcmdth/ffrwd-node", tag = "v0.2.0" }
serde = { version = "1.0.229", features = ["derive"] }
rfdetr-gpu = { path = "../gpu", optional = true }

[dev-dependencies]
serde_json = "1.0.151"
