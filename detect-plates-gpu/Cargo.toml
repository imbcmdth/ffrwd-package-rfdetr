[package]
name = "detect-plates-gpu"
version = "0.2.0"
edition = "2021"

# detect-plates's own source with the `gpu` feature on: the build that may hold
# its frames on the GPU, as detect_plates_gpu.wasm beside the host build's
# detect_plates.wasm.
[lib]
name = "detect_plates_gpu"
path = "../detect-plates/src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["gpu"]
gpu = []

[dependencies]
ffrwd-node = { git = "https://github.com/imbcmdth/ffrwd-node", tag = "v0.2.0" }
rfdetr-common = { path = "../common" }
rfdetr-gpu = { path = "../gpu" }

[dev-dependencies]
serde_json = "1.0.151"
