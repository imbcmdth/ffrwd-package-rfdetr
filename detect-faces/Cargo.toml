[package]
name = "detect-faces"
version = "0.2.0"
edition = "2021"

[lib]
name = "detect_faces"
crate-type = ["cdylib"]

[features]
# The GPU build: the graph's input made by the host from a frame that may be
# held on the GPU, importing ffrwd:gpu and wasi:webgpu. The `detect-faces-gpu`
# crate builds this source with it on, as detect_faces_gpu.wasm.
gpu = ["dep:rfdetr-gpu"]

[dependencies]
ffrwd-node = { git = "https://github.com/imbcmdth/ffrwd-node", tag = "v0.2.0" }
rfdetr-common = { path = "../common" }
rfdetr-gpu = { path = "../gpu", optional = true }

[dev-dependencies]
serde_json = "1.0.151"
