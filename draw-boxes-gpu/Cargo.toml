[package]
name = "draw-boxes-gpu"
version = "0.2.0"
edition = "2021"

# draw-boxes's own source with the `gpu` feature on: the build that may hold
# its frames on the GPU, as draw_boxes_gpu.wasm beside the host build's
# draw_boxes.wasm.
[lib]
name = "draw_boxes_gpu"
path = "../draw-boxes/src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["gpu"]
gpu = []

[dependencies]
ffrwd-node = { git = "https://github.com/imbcmdth/ffrwd-node", tag = "v0.2.0" }
serde = { version = "1.0.229", features = ["derive"] }
rfdetr-gpu = { path = "../gpu" }

[dev-dependencies]
serde_json = "1.0.151"
