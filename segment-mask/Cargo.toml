[package]
name = "segment-mask"
version = "0.2.0"
edition = "2021"

[lib]
name = "segment_mask"
crate-type = ["cdylib"]

[features]
# The GPU build: the graph's input made by the host from a frame that may be
# held on the GPU, and the matte painted on the device, importing ffrwd:gpu
# and wasi:webgpu. The `segment-mask-gpu` crate builds this source with it
# on, as segment_mask_gpu.wasm.
gpu = ["dep:rfdetr-gpu"]

[dependencies]
ffrwd-node = { git = "https://github.com/imbcmdth/ffrwd-node", tag = "v0.2.0" }
ffrwd-frame = { git = "https://github.com/imbcmdth/ffrwd-frame", tag = "v0.1.1" }
serde = { version = "1.0.229", features = ["derive"] }
rfdetr-common = { path = "../common" }
rfdetr-gpu = { path = "../gpu", optional = true }
