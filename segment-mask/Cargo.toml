[package]
name = "segment-mask"
version = "0.2.0"
edition = "2021"

[lib]
name = "segment_mask"
crate-type = ["cdylib"]

[dependencies]
ffrwd-node = { git = "https://github.com/imbcmdth/ffrwd-node", tag = "v0.1.0" }
ffrwd-frame = { git = "https://github.com/imbcmdth/ffrwd-frame", tag = "v0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
rfdetr-common = { path = "../common" }
